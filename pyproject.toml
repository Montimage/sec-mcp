[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-mcp"
version = "0.4.0"
description = "Python toolkit providing security checks for domains, URLs, IPs, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [ { name = "Montimage" } ]
dependencies = [
  "httpx>=0.25.0",
  "click>=8.3.3",
  "idna>=3.15,<3.20",
  "mcp[cli]>=2.2,<3",
  "schedule>=1.2.0",
  "platformdirs>=4.0.0,<4.11.9",
  "psutil>=5.9.0",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
keywords = ["security", "blacklist", "mcp", "phishing", "malware"]

# pytricia ships no wheels (source builds need a C compiler), so it is an
# opt-in extra: sec_mcp/storage_v2.py falls back to a pure-Python `ipaddress`
# CIDR matcher when it is absent. See docs/decisions/2026-09-18-pytricia-schedule.md.
[project.optional-dependencies]
fast-cidr = ["pytricia>=1.0.0"]

[dependency-groups]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.1",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  # Keep the fast CIDR path exercised in dev/CI; end users opt in via
  # `pip install sec-mcp[fast-cidr]` (needs a C compiler for the sdist).
  "pytricia>=1.0.0",
]

[project.urls]
Homepage      = "https://github.com/Montimage/sec-mcp"
Repository    = "https://github.com/Montimage/sec-mcp.git"
Documentation = "https://github.com/Montimage/sec-mcp#readme"

[project.scripts]
sec-mcp = "sec_mcp.cli:cli"
sec-mcp-server = "sec_mcp.start_server:main"

# MANIFEST.in grafts sec_mcp/tests into the sdist only — do not let those
# files ride into the wheel via the sdist manifest. config.json still ships
# through the explicit package-data table below.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["sec_mcp*"]
# sec_mcp/tests is a pytest suite, not shipped package code: keep it out of
# the wheel (pyproject `find` defaults namespaces=true, so it is discovered
# as a namespace package even without __init__.py).
exclude = ["sec_mcp.tests*"]

[tool.setuptools.package-data]
sec_mcp = ["config.json"]

# Advisory floors for transitive dependencies (uv resolves with these lower
# bounds without making them direct requirements):
#   h11>=0.16.0          PYSEC-2026-348
#   starlette>=1.3.1     PYSEC-2026-161/1941/1942/2280/2281/248/249 (mcp 1.x
#                        already resolves starlette 1.x for py>=3.14)
#   pygments>=2.20.0     PYSEC-2026-2987
#   python-dotenv>=1.2.2 PYSEC-2026-2270
[tool.uv]
constraint-dependencies = [
  "h11>=0.16.0",
  "starlette>=1.3.1",
  "pygments>=2.20.0",
  "python-dotenv>=1.2.2",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Adopted rule families: pyflakes (F) and isort (I) — the mechanical-autofix
# scope of issue #12. Rules in scope that need manual triage are deferred via
# explicit ignores rather than silently dropped:
#   F811 — duplicate definitions (sec_mcp.check_batch, inner re-imports)
#   F841 — unused locals needing a human decision
# Other families (E/W/UP/B/…) are out of scope for this pass and unselected.
select = ["F", "I"]
ignore = ["F811", "F841"]
