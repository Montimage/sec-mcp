# GitHub Actions workflow to build and publish package to PyPI on tag push
name: Publish Python Package to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  test:
    name: Build, lint and test (baseline >= 32/64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Single pinned release version, sourced from .python-version.
          python-version-file: '.python-version'

      - name: Verify tag matches package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "Tag 'v$tag_version' does not match pyproject.toml version '$pkg_version'" >&2
            exit 1
          fi

      - name: Install uv
        run: pip install "uv==0.12.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build package
        run: uv run --with build python -m build

      - name: Ruff
        run: uv run ruff check .

      - name: Test suite (baseline gate)
        run: ./scripts/check_test_baseline.sh

      - name: Upload tested distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Verify tag and publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # Token auth — no trusted publisher is registered on PyPI for this
          # repo's OIDC claims, so the OIDC exchange fails (invalid-publisher).
          password: ${{ secrets.PYPI_API_TOKEN }}
