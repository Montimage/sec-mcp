name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Build, lint and test (baseline >= 32/64) — py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install "uv==0.12.13"

      - name: Install dependencies
        # --python is required: .python-version would otherwise pin uv to
        # 3.11 on every matrix leg, silently defeating the version matrix.
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Build package
        run: uv run --with build python -m build

      - name: Ruff
        run: uv run ruff check .

      - name: Test suite (baseline gate)
        run: ./scripts/check_test_baseline.sh

  landing:
    name: Landing page build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./react-landing-page
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './react-landing-page/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build landing page
        run: npm run build
