# Local hooks only — mirrors the CI gates deterministically using the
# project's own locked toolchain (uv sync / ruff / pytest baseline script),
# with no external hook repos to download or pin.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: pytest-baseline
        name: pytest suite (baseline >= 32/64)
        entry: ./scripts/check_test_baseline.sh
        language: system
        types: [python]
        pass_filenames: false
